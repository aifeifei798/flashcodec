name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (CPU torch + transformers 5.x)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[hf]"

      - name: Codec tests (jpeg / png / causal / attention)
        run: |
          python tests/test_jpeg.py
          python tests/test_png.py
          python tests/test_causal.py
          python tests/test_attention.py

      - name: Transformers 5.x integration
        run: python tests/test_hf_integration.py
