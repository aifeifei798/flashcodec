[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flashcodec-kv"
version = "0.6.0"
description = "Compress Transformer time-series KV cache tensors as high-dimensional multimedia image signals: JPEG-style lossy frequency domain (DCT) plus PNG-style lossless time-domain deltas"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "feifei", email = "aifeifei798@gmail.com" }]
keywords = ["kv-cache", "transformer", "dct", "compression", "llm", "inference"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["torch>=2.0"]

[project.optional-dependencies]
hf = ["transformers>=5.20"]
demo = ["gradio", "matplotlib"]

[project.urls]
Homepage = "https://github.com/aifeifei798/flashcodec-kv"
Repository = "https://github.com/aifeifei798/flashcodec-kv"
Issues = "https://github.com/aifeifei798/flashcodec-kv/issues"
Changelog = "https://github.com/aifeifei798/flashcodec-kv/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["flashcodec*"]
